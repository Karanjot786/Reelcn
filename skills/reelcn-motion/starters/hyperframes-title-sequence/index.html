<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Title sequence</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Instrument Serif"; font-weight: 400; src: url("assets/fonts/instrument-serif-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 300; src: url("assets/fonts/inter-latin-300-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 400; src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2"); }
      :root { --black: #07080a; --paper: #f4efe6; --light: #ffd9a0; }
      html, body { margin: 0; background: var(--black); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--black); color: var(--paper); }
      .abs { position: absolute; }
      #leak { left: 0; top: 0; width: 1920px; height: 1080px; background: radial-gradient(ellipse 60% 40% at 50% 55%, rgba(255, 190, 120, 0.13), rgba(255, 190, 120, 0) 70%); opacity: 0; }
      #stage { left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 560px; }
      #mask { left: 0; top: 330px; width: 1920px; height: 250px; overflow: hidden; }
      #title { left: 0; top: 0; width: 1920px; text-align: center; font: 400 196px/250px "Instrument Serif", serif; letter-spacing: -2px; white-space: nowrap; }
      #title .l { display: inline-block; }
      #credit { left: 0; top: 0; width: 1920px; text-align: center; font: 300 66px/250px "Inter", sans-serif; letter-spacing: 0.5px; white-space: nowrap; color: #d9d2c5; }
      #credit b { font-weight: 400; color: var(--paper); }
      #year { left: 0; top: 0; width: 1920px; text-align: center; font: italic 400 110px/250px "Instrument Serif", serif; white-space: nowrap; }
      #line { left: 960px; top: 588px; width: 0; height: 2px; margin-left: 0; border-radius: 2px; background: var(--light); box-shadow: 0 0 14px 2px rgba(255, 217, 160, 0.55); }
      #streak { left: 0; top: 584px; width: 180px; height: 10px; border-radius: 5px; background: radial-gradient(ellipse at center, rgba(255, 244, 222, 0.95), rgba(255, 244, 222, 0) 70%); opacity: 0; }
      #bloom { left: 0; top: 388px; width: 520px; height: 400px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255, 214, 160, 0.34), rgba(255, 214, 160, 0) 68%); opacity: 0; }
      #grain { left: -768px; top: -768px; width: 3456px; height: 2616px; background: url("assets/tex/grain.jpg") repeat; background-size: 512px 512px; mix-blend-mode: screen; opacity: 0.05; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="8">
      <div id="leak" class="abs"></div>
      <div id="stage" class="abs">
        <div id="mask" class="abs" data-layout-allow-overflow data-layout-allow-overlap data-layout-allow-occlusion>
          <div id="title" class="abs" data-layout-allow-overlap data-layout-allow-occlusion><span class="l">T</span><span class="l">h</span><span class="l">e</span><span class="l">&nbsp;</span><span class="l">Q</span><span class="l">u</span><span class="l">i</span><span class="l">e</span><span class="l">t</span><span class="l">&nbsp;</span><span class="l">H</span><span class="l">o</span><span class="l">u</span><span class="l">r</span><span class="l">s</span></div>
          <div id="credit" class="abs" data-layout-allow-overlap data-layout-allow-occlusion>A film by <b>Ana Ruiz</b></div>
          <div id="year" class="abs" data-layout-allow-overlap data-layout-allow-occlusion>2026</div>
        </div>
        <div id="line" class="abs"></div>
        <div id="streak" class="abs"></div>
        <div id="bloom" class="abs"></div>
      </div>
      <div id="grain" class="abs"></div>
      <!-- biome-ignore lint/a11y/useMediaCaption: music and sound effects only, no words to caption -->
      <audio id="track" src="assets/audio/track.mp3" data-start="0" data-duration="8" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });
        const letters = gsap.utils.toArray("#title .l");
        gsap.set(letters, { yPercent: 100 });
        gsap.set("#credit", { yPercent: 100 });
        gsap.set("#year", { yPercent: 100 });
        gsap.set("#streak", { x: 470, opacity: 0 });
        gsap.set("#bloom", { x: 300, opacity: 0 });
        // A glint rides the line on every beat (100 BPM), alternating direction, with a soft bloom under it.
        const BEAT = 0.6;
        for (let k = 0; k < 11; k++) {
          const t = 0.9 + k * BEAT;
          const [a, b] = k % 2 === 0 ? [470, 1270] : [1270, 470];
          tl.fromTo("#streak", { x: a, opacity: 0 }, { x: b, keyframes: { opacity: [0, 0.95, 0.95, 0] }, duration: BEAT, ease: "power1.inOut" }, t);
          tl.fromTo("#bloom", { x: a - 170, opacity: 0 }, { x: b - 170, keyframes: { opacity: [0, 1, 1, 0] }, duration: BEAT, ease: "power1.inOut" }, t);
        }

        // Film grain at 24 frames per second, placed by a seeded walk so every render matches.
        let seed = 11;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
        for (let f = 0; f < 8 * 24; f++) tl.set("#grain", { x: Math.round(rnd() * 512), y: Math.round(rnd() * 512) }, f / 24);

        /* dark: a line of light draws across the frame (0 - 1.8s) */
        tl.fromTo("#line", { width: 0, x: 0 }, { width: 980, x: -490, duration: 1.2, ease: "power3.inOut" }, 0.15);
        tl.to("#line", { height: 3, boxShadow: "0 0 34px 5px rgba(255, 217, 160, 0.85)", duration: 0.5, ease: "power2.in" }, 1.3);
        tl.to("#leak", { opacity: 1, duration: 1.6, ease: "power1.inOut" }, 0.2);

        /* title: the line opens into the title, letters focus out of blur (1.8 - 4.2s) */
        tl.to("#line", { height: 2, boxShadow: "0 0 14px 2px rgba(255, 217, 160, 0.55)", duration: 0.5, ease: "power2.out" }, 1.8);
        tl.fromTo(letters, { yPercent: 100, filter: "blur(18px)", opacity: 0.4 }, { yPercent: 0, filter: "blur(0px)", opacity: 1, duration: 0.9, ease: "power4.out", stagger: { each: 0.045, from: "center" } }, 1.8);
        tl.fromTo("#stage", { scale: 1 }, { scale: 1.14, duration: 6.2, ease: "none" }, 1.8);
        tl.fromTo("#leak", { x: 0 }, { x: 160, duration: 6.2, ease: "none" }, 1.8);

        /* credit: it slides along the baseline as the title lifts away (4.2 - 6.6s) */
        tl.to(letters, { yPercent: -110, filter: "blur(12px)", opacity: 0, duration: 0.38, ease: "power3.in", stagger: { each: 0.02, from: "start" } }, 4.2);
        tl.fromTo("#credit", { yPercent: 100, x: 260 }, { yPercent: 0, x: 0, duration: 0.6, ease: "power4.out" }, 4.92);
        tl.to("#credit", { x: -60, duration: 0.88, ease: "none" }, 5.52);

        /* year: the year settles onto the baseline, which shrinks to a point (6.6 - 8s) */
        tl.to("#credit", { x: -420, yPercent: -40, opacity: 0, filter: "blur(10px)", duration: 0.28, ease: "power3.in" }, 6.4);
        tl.fromTo("#year", { yPercent: 100, filter: "blur(12px)" }, { yPercent: 0, filter: "blur(0px)", duration: 0.6, ease: "power4.out" }, 6.68);
        tl.to("#line", { width: 10, x: -5, duration: 0.8, ease: "power4.inOut" }, 6.85);
        tl.to("#line", { boxShadow: "0 0 40px 10px rgba(255, 217, 160, 0.9)", duration: 0.3, ease: "power2.out" }, 7.55);
        tl.to("#line", { opacity: 0, scale: 0.4, duration: 0.3, ease: "power2.in" }, 7.7);

        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      });
    </script>
  </body>
</html>
