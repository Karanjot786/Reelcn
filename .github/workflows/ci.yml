name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm registry:build
      - name: Generated files must be committed
        run: git diff --exit-code -- registry.json apps/www/public
      - name: Core self-test
        run: pnpm test:self
      - name: Smoke render every demo
        run: pnpm stills smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stills
          path: out/
