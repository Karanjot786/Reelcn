name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Typecheck items at the user's es2015 lib
        run: pnpm typecheck:user
      - run: pnpm lint
      - name: No clock, randomness or CSS animation in components
        run: pnpm check:determinism
      - run: pnpm test
      - name: Sound effects are CC0 and listed
        run: pnpm sfx:check
      - run: pnpm registry:build
      - name: Generated files must be committed
        run: pnpm check:drift
      - name: Build the site
        run: pnpm site:build
      - name: Core self-test
        run: pnpm test:self
      - name: Smoke render every demo (fails blank or static demos)
        run: pnpm stills smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stills
          path: out/
